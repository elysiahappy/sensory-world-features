# 居民生日配置（城市内生日，与原作生日无关）
#
# 两种写法任选：
#   1. month + day：城市历法月/日（每月固定 30 天）
#   2. day_of_year：城市历法一年中的第几天（1~360）
#
# 未配置的 NPC 不触发生日链路。
# 季节对照（每年 360 天，每季 90 天）：
#   春：1~3 月（day_of_year 1~90）
#   夏：4~6 月（91~180）
#   秋：7~9 月（181~270）
#   冬：10~12 月（271~360）

birthdays:
  - npc_id: sparkle       # 花火（烟火大会主办）
    month: 7
    day: 20
    note: 喜欢热闹的夏天生日
  - npc_id: robin         # 知更鸟（歌手）
    month: 4
    day: 12
    note: 春天出生的歌者
  - npc_id: eden          # 伊甸
    month: 10
    day: 5
    note: 入秋的生日
  - npc_id: march7th      # 三月七（摄影）
    month: 3
    day: 7
    note: 名字就带着日期
  - npc_id: griseo        # 格蕾修（学生）
    month: 6
    day: 18
  - npc_id: rin           # 铃（学生）
    month: 8
    day: 8
  - npc_id: theresa       # 德丽莎（学园长）
    month: 12
    day: 24
    note: 深冬的生日
  - npc_id: bronya        # 布洛妮娅（游戏厅老板）
    month: 9
    day: 15
  - npc_id: violet        # 薇尔莉特（邮差）
    month: 2
    day: 14
    note: 情人节前后出生的代笔邮差
